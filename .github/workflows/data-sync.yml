name: 資料同步

on:
  schedule:
    # GitHub cron is UTC. Hong Kong is UTC+8 all year.
    # Official scans are 09:00 and 17:00 HKT. Run one hour later.
    # 02:00 UTC = 10:00 HKT. 10:00 UTC = 18:00 HKT.
    - cron: "0 2 * * *"
    - cron: "0 10 * * *"
  push:
    branches:
      - incoming/verified
  workflow_dispatch:
    inputs:
      snapshot_ref:
        description: "已核對快照的分支。預設 incoming/verified。"
        required: false
        default: "incoming/verified"
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 取出 main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安裝依賴
        run: npm ci

      - name: 分類快照並合併或開草稿
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.snapshot_ref || '' }}
          SNAPSHOT_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: node scripts/sync-run.mjs --push
