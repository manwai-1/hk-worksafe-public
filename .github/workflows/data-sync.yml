name: 資料同步

on:
  schedule:
    # GitHub cron is UTC. Hong Kong is UTC+8 all year.
    # 00:15 UTC = 08:15 HKT. 12:15 UTC = 20:15 HKT.
    - cron: "15 0 * * *"
    - cron: "15 12 * * *"
  workflow_dispatch:
    inputs:
      snapshot_ref:
        description: "已核對快照的分支。預設 incoming/verified。"
        required: false
        default: "incoming/verified"
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 取出 main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安裝依賴
        run: npm ci

      - name: 分類快照並合併或開草稿
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.snapshot_ref || 'incoming/verified' }}
        run: node scripts/sync-run.mjs --push
